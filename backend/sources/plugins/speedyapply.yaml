name: speedyapply
display_name: SpeedyApply SWE Jobs (GitHub)
version: "1.1.0"
author: langhire
description: "Import every FAANG+ and Other internship with its direct Apply link from the GitHub README"
countries: [US]
website: https://github.com/speedyapply/2027-SWE-College-Jobs
requires_login: false
login_url: ""

search_url: "https://github.com/speedyapply/2027-SWE-College-Jobs"

# Collection for this source is NOT driven by this prompt. The generic
# prompt-driven plugin engine (PluginConfig.render_collection_prompt) is
# defined in registry.py but nothing in the app actually feeds it to a
# browser agent -- every plugin's collection_prompt is currently dead code.
# collect_speedyapply() downloads the raw README and reads Posting links
# without a browser or description fetching, dispatched by
# `source == "speedyapply"` in backend/main.py's start_collection(). This
# field only exists because the registry requires it to be present.
collection_prompt: |
  Unused -- see collect_speedyapply() in cli/collect_jobs.py.

# Apply for a speedyapply-collected job goes through the existing
# apply_jobs.py pipeline like any other job (Workday deterministic engine
# by URL, generic LLM cleanup otherwise) -- not through this prompt, which
# (like every plugin's apply_prompt) is never actually invoked anywhere.
apply_prompt: |
  Unused -- speedyapply jobs apply through the normal apply_jobs.py flow.
